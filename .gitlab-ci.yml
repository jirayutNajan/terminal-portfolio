stages:
  - build
  - release

build-job:
  stage: build
  image: golang:1.25
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  parallel:
    matrix:
      - OS_TYPE: ['linux']
        ARCH: ['amd64']
      - OS_TYPE: ['windows']
        ARCH: ['amd64']
      - OS_TYPE: ['darwin']
        ARCH: ['arm64']
  script:
    - echo "Running on $OS_TYPE..."

    - |
      GOOS=$OS_TYPE
      GOARCH=$ARCH
      echo "BUILD_JOB_ID_${GOOS}_${GOARCH}=$CI_JOB_ID" >> build.env
      go build -o "terminal-port-${GOOS}-${GOARCH}" .

  artifacts:
    paths:
      - terminal-port-*
    reports:
      dotenv: build.env
    expire_in: 1 day

# gitlab will automatic download artifact from previous job
release_job:
  stage: release
  needs:
    - job: build-job
      artifacts: true
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  script: # must have some script
    - echo "running release job"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "terminal-port-linux-amd64"
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID_linux_amd64/artifacts/file/dist/terminal-port-linux-amd64"
        - name: "terminal-port-darwin-amd64"
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID_darwin_amd64/artifacts/file/dist/terminal-port-darwin-amd64"
        - name: "terminal-port-windows-amd64.exe"
          url: "$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID_windows_amd64/artifacts/file/dist/terminal-port-windows-amd64.exe"
