stages:
  - build
  - release

build-job:
  stage: build
  image: golang:1.25
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  parallel:
    matrix:
      - OS_TYPE: ['linux', 'windows', 'darwin']
      - ARCH: ['amd64', 'amd64', 'arm64']
  script:
    - echo "Running on $OS_TYPE..."

    - |
      GOOS=$OS_TYPE
      GOARCH=$ARCH
      go build -o "terminal-port-${GOOS}-${GOARCH}" .
  artifacts:
    paths:
      - terminal-port-*
    expire_in: 1 day

release_job:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'
  script:
    - echo "running release job"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
